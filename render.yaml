services:
  - type: web
    name: skillswap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SKILLSWAP_STATIC
        value: /app/static
      - key: SKILLSWAP_ADMIN_EMAIL
        sync: false
      - key: SKILLSWAP_ADMIN_PASSWORD
        sync: false
      - key: SKILLSWAP_ADMIN_NAME
        value: Platform Admin
